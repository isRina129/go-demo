name: 构建订单服务制品
run-name: fc-devops-artifact-${{ inputs.artifact_id }}

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: fc-devops 构建制品 ID
        required: true
        type: string
      git_tag:
        description: 选中的 Git Tag
        required: true
        type: string
      commit_sha:
        description: fc-devops 解析出的固定提交 SHA
        required: true
        type: string
      artifact_type:
        description: 构建制品类型
        required: true
        type: string
      artifact_token:
        description: 短期制品凭证
        required: true
        type: string
      credentials_url:
        description: STS 凭证交换地址
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fc-devops-order-${{ inputs.artifact_id }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      GIT_TAG: ${{ inputs.git_tag }}
      COMMIT_SHA: ${{ inputs.commit_sha }}
      ARTIFACT_TYPE: ${{ inputs.artifact_type }}
      ARTIFACT_TOKEN: ${{ inputs.artifact_token }}
      CREDENTIALS_URL: ${{ inputs.credentials_url }}
    steps:
      - name: 校验平台输入
        shell: bash
        run: |
          echo "::add-mask::$ARTIFACT_TOKEN"
          test -n "$ARTIFACT_ID"
          test "$ARTIFACT_TYPE" = "ZIP"
          test -n "$CREDENTIALS_URL"

      - name: 检出固定提交
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: 校验提交
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$COMMIT_SHA"

      - name: 配置 Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: 执行测试
        run: go test ./...

      - name: 构建函数压缩包
        env:
          VERSION: ${{ inputs.git_tag }}
        run: ./scripts/build-custom-runtime.sh order

      - name: 使用 STS 上传制品
        run: ./scripts/publish-zip.sh dist/order.zip
